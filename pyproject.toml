[build-system]
requires = ["setuptools>=77"]  # PEP 639: license = "MIT"
build-backend = "setuptools.build_meta"

[project]
name = "ntm"
version = "0.1.0"
description = "Verwaltung von Therapiematerialien"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi",
    "uvicorn",
    "markdown-it-py",
    "linkify-it-py",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.scripts]
ntm = "ntm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ntm = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
